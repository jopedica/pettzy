{% extends "base.html" %}
{% block content %}

<main class="container pad-y">
  <h1 class="auth__title">Criar conta</h1>

  <form class="auth-form" action="{{ url_for('main.cadastro') }}" method="post" novalidate>
    <label class="label" for="nome">Nome completo</label>
    <input class="input" id="nome" name="nome" type="text"
           placeholder="Digite seu nome completo" required
           value="{{ request.form.get('nome','') }}" />

    <label class="label" for="email">E-mail</label>
    <input class="input" id="email" name="email" type="email"
           placeholder="Digite seu e-mail" required
           value="{{ request.form.get('email','') }}" />

    <div class="grid grid-2">
      <div>
        <label class="label" for="cpf">CPF</label>
        <input class="input" id="cpf" name="cpf" type="text" inputmode="numeric"
               placeholder="000.000.000-00" maxlength="14"
               value="{{ request.form.get('cpf','') }}" />
      </div>
      <div>
        <label class="label" for="celular">Celular</label>
        <input class="input" id="celular" name="celular" type="tel" inputmode="tel"
               placeholder="(61) 9 9999-9999" maxlength="16"
               value="{{ request.form.get('celular','') }}" />
      </div>
    </div>

    <label class="label" for="senha">Senha</label>
    <div class="input-icon">
      <input class="input" id="senha" name="senha" type="password"
             placeholder="Crie uma senha" minlength="6" required />
      <button class="toggle-pass" type="button" data-target="senha" aria-label="Mostrar senha">👁️</button>
    </div>

    <label class="label" for="confirmar-senha">Confirmar senha</label>
    <div class="input-icon">
      <input class="input" id="confirmar-senha" name="confirmar-senha" type="password"
             placeholder="Confirme sua senha" minlength="6" required />
      <button class="toggle-pass" type="button" data-target="confirmar-senha" aria-label="Mostrar senha">👁️</button>
    </div>

    <button class="btn" type="submit">Cadastrar</button>
  </form>
</main>

<script>
  // Toggle de senha
  (function () {
    document.querySelectorAll('.toggle-pass').forEach(btn => {
      const input = document.getElementById(btn.dataset.target);
      if (!input) return;
      btn.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });
  })();

  // Máscaras visuais para CPF e celular (sem impactar o backend)
  (function () {
    const onlyDigits = v => (v || '').replace(/\D/g, '');

    const cpf = document.getElementById('cpf');
    if (cpf) {
      cpf.addEventListener('input', () => {
        let v = onlyDigits(cpf.value).slice(0, 11);
        if (v.length > 9)      cpf.value = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
        else if (v.length > 6) cpf.value = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
        else if (v.length > 3) cpf.value = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
        else                   cpf.value = v;
      });
    }

    const cel = document.getElementById('celular');
    if (cel) {
      cel.addEventListener('input', () => {
        let v = onlyDigits(cel.value).slice(0, 11);
        if (v.length > 6)      cel.value = v.replace(/(\d{2})(\d{1})(\d{4})(\d{0,4})/, '($1) $2 $3-$4');
        else if (v.length > 2) cel.value = v.replace(/(\d{2})(\d{0,9})/, '($1) $2');
        else                   cel.value = v;
      });
    }
  })();
</script>

{% endblock %}
